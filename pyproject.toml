[tool.ruff]
target-version = "py314"
line-length = 120
src = ["app", "tests", "utils"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # imports sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # code simplification
    "ASYNC",    # async code bugs
    "S",        # security (bandit)
    "FAST",     # FastAPI
    "RUF",      # ruff
]